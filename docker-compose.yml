version: "3.9"

services:
  worker:
    build: .
    command: celery -A app.celery_app worker -l info
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/app_db
    networks:
      - default
      - more_platform
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    build: .
    command: celery -A app.celery_app beat -l info --pidfile /app/celerybeat.pid
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/app_db
    networks:
      - default
      - more_platform
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/celerybeat.pid && kill -0 $(cat /app/celerybeat.pid) 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default: {}
  more_platform:
    external: true
    name: traefik_default
